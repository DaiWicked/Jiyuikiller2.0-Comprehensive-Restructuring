<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Windows 10</title>
    <style>
        * {
            font-family: "微软雅黑","Microsoft YaHei","Segoe UI",Helvetica,Arial,sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            overflow: hidden;
            cursor: none;
        }
        .xgoing0 {
            position: fixed;
            top: -1%;
            left: -1%;
            height: 101%;
            width: 101%;
            cursor: none;
            color: #fff;
            background-color: #000000;
            overflow: hidden;
            user-select: none;
        }
        .xgoing1 {
            position: fixed;
            top: -1%;
            left: -1%;
            height: 101%;
            width: 101%;
            cursor: none;
            color: #fff;
            transition: all .7s;
            overflow: hidden;
            user-select: none;
            background-color: #000000;
            animation: xgoing1ani 10s linear infinite 0s;
        }
        @keyframes xgoing1ani {
            0% { background: #00284f; }
            25% { background: #004b96; }
            50% { background: #0066c7; }
            75% { background: #004b96; }
            100% { background: #00284f; }
        }
        #oobeword1 {
            display: none;
            position: absolute;
            top: 44.5%;
            left: 0%;
            width: 100%;
            font-weight: 100;
            text-align: center;
            font-size: 50px;
            z-index: 1000;
        }
        #oobeword2 {
            display: none;
            position: absolute;
            bottom: 5%;
            left: 0%;
            width: 100%;
            font-weight: 100;
            text-align: center;
            font-size: 20px;
            z-index: 1000;
        }
        /* 加载旋转点 */
        .spinner {
            display: none;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
        }
        .spinner::before {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="xgoing0" id="xgoing">
        <span id="oobeword1"></span>
        <span id="oobeword2"></span>
        <div id="xgoing2" style="display: none;"></div>
        <div class="spinner" id="spinner"></div>
        <div id="oobeend"></div>
    </div>

    <script>
        // 恶搞文字配置
        var greet = "嗨，别来无恙啊！";
        var greet1 = "一切即将准备就绪";
        var text1 = "这可能需要几分钟";
        var text2 = "一切交给我们来处理";
        var textbot = "请勿关闭电脑";
        var text2bot = "请勿关闭电脑";
        var poem = "千门万户曈曈日，总把新桃换旧符\nWindows 将保持最佳状态，为你的网络之旅保驾护航";
        var end = "马上就好";
        var period1 = 30;
        var period2 = 30;
        var period3 = 30;

        window.temp_i = 0;
        var sto = null;

        // 屏蔽所有可能退出的按键
        document.onkeydown = function(e) {
            e = e || window.event;
            // 屏蔽 F11, Esc, Alt+F4, Win键, Ctrl+W, Ctrl+Shift+W, Alt+Tab
            if (e.keyCode == 122 || e.keyCode == 27 || 
                (e.altKey && e.keyCode == 115) || 
                e.keyCode == 91 || e.keyCode == 92 ||
                (e.ctrlKey && e.keyCode == 87) ||
                (e.ctrlKey && e.shiftKey && e.keyCode == 87)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        };

        // 屏蔽右键菜单
        document.oncontextmenu = function(e) {
            e.preventDefault();
            return false;
        };

        // 动画阶段
        function changertp() {
            xgoing.style.display = "block";
            oobeword1.style.display = "block";
            oobeword1.innerHTML = greet;
            window.temp_i = window.temp_i + 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 100) {
                window.temp_i = 100;
                sto = setTimeout("changertp2();", 2000);
                return;
            }
            sto = setTimeout("changertp();", 12);
        }
        function changertp2() {
            window.temp_i = window.temp_i - 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 0) {
                window.temp_i = 0;
                sto = setTimeout('changertp3();', 128);
                return;
            }
            sto = setTimeout("changertp2();", 12);
        }
        function changertp3() {
            oobeword1.innerHTML = greet1;
            window.temp_i = window.temp_i + 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 100) {
                window.temp_i = 100;
                sto = setTimeout("changertp4();", 3000);
                return;
            }
            sto = setTimeout("changertp3();", 12);
        }
        function changertp4() {
            window.temp_i = window.temp_i - 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 0) {
                window.temp_i = 0;
                sto = setTimeout('changertp5();', 128);
                return;
            }
            setTimeout("changertp4();", 12);
        }
        function changertp5() {
            xgoing2.className = "xgoing1";
            xgoing2.style.display = "block";
            oobeword1.innerHTML = text1;
            oobeword2.innerHTML = textbot;
            oobeword2.style.display = "block";
            spinner.style.display = "block";
            window.temp_i = window.temp_i + 1;
            oobeword1.style.opacity = (window.temp_i/100);
            oobeword2.style.opacity = (window.temp_i/100);
            if (window.temp_i == 100) {
                window.temp_i = 100;
                sto = setTimeout("changertp6();", period1*1000);
                return;
            }
            sto = setTimeout("changertp5();", 12);
        }
        function changertp6() {
            window.temp_i = window.temp_i - 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 0) {
                window.temp_i = 0;
                sto = setTimeout('changertp7();', 128);
                return;
            }
            sto = setTimeout("changertp6();", 12);
        }
        function changertp7() {
            oobeword1.innerHTML = text2;
            oobeword2.innerHTML = text2bot;
            window.temp_i = window.temp_i + 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 100) {
                window.temp_i = 100;
                sto = setTimeout("changertp8();", period2*1000);
                return;
            }
            sto = setTimeout("changertp7();", 12);
        }
        function changertp8() {
            window.temp_i = window.temp_i - 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 0) {
                oobeword1.innerHTML = "";
                oobeword1.style.display = "none";
                spinner.style.display = "none";
                window.temp_i = 0;
                sto = setTimeout('oobeword1.style.top = "38.7%";oobeword1.innerHTML = poem.replace(/\\n/g,"<br>");oobeword1.style.display = "block";oobeword2.style.display = "block";changertp9();', 128);
                return;
            }
            sto = setTimeout("changertp8();", 12);
        }
        function changertp9() {
            window.temp_i = window.temp_i + 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 100) {
                window.temp_i = 100;
                sto = setTimeout("changertp10();", period3*1000);
                return;
            }
            sto = setTimeout("changertp9();", 12);
        }
        function changertp10() {
            window.temp_i = window.temp_i - 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 0) {
                window.temp_i = 0;
                sto = setTimeout('changertp11();', 128);
                return;
            }
            sto = setTimeout("changertp10();", 12);
        }
        function changertp11() {
            xgoing2.className="xgoing0";
            oobeword1.style.top = "44.5%";
            oobeword1.innerHTML = end;
            oobeword2.style.display = "none";
            window.temp_i = window.temp_i + 1;
            oobeword1.style.opacity = (window.temp_i/100);
            if (window.temp_i == 100) {
                window.temp_i = 100;
                sto = setTimeout("changertp12();", 5000);
                return;
            }
            sto = setTimeout("changertp11();", 12);
        }
        function changertp12() {
            sto = "";
            window.temp_i = 0;
            oobeword1.style.opacity = 0;
            // 循环播放
            setTimeout(function() {
                oobeword1.style.top = "44.5%";
                changertp();
            }, 500);
        }

        // 页面加载后自动开始
        window.onload = function() {
            setTimeout(function() {
                changertp();
            }, 500);
        };
    </script>
</body>
</html>
